<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancestors Stories</title>
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W630DJTY55"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Lato", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .book {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            margin: auto;
            width: 70vw; /* 70% of the page */
            height: calc(70vw * 0.675); /* Maintain aspect ratio */
            max-width: 55rem;
            max-height: 37.125rem;
            perspective: 70rem;
        }
        .cover {
            background-color: #663720;
            transform: rotateY(0deg);
            width: 50%; /* Half the book width */
            height: 100%;
        }
        .page {
            top: 0.25rem;
            left: 0.25rem;
            background-color: #ecc6a4;
            transform: rotateY(0deg);
            width: calc(50% - 0.5rem); /* Adjusted for new sizing */
            height: calc(100% - 0.5rem);
            text-align: right;
            font-size: 8px;
            color: #777;
            font-family: sans-serif;
        }
        .page::before, .page::after {
            display: block;
            border-top: 1px dashed rgba(0, 0, 0, 0.3);
            content: "";
            padding-bottom: 1rem;
        }
        .cover, .page {
            position: absolute;
            padding: 1rem;
            transform-origin: 0% 0; /* Left edge for opening from the left */
            border-radius: 0 5px 5px 0; /* Adjusted border-radius */
            box-shadow: inset -3px 0px 20px rgba(0, 0, 0, 0.2),
                              0px 0px 15px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }
        .cover.turn {
            animation: bookCover 3.5s ease forwards; /* Slowed and eased */
        }
        .page.turn {
            animation: bookOpen 3.5s ease forwards; /* Slowed and eased */
        }
        .page:nth-of-type(1) {
            animation-delay: 0.05s;
        }
        .page:nth-of-type(2) {
            animation-delay: 0.33s;
        }
        .page:nth-of-type(3) {
            animation-delay: 0.66s;
        }
        .page:nth-of-type(4) {
            animation: bookOpenFlat 3.5s ease forwards; /* Slowed and eased */
            animation-delay: 0.99s;
        }
        .page:nth-of-type(5) {
            animation: bookOpenFlat 3.5s ease forwards; /* Slowed and eased */
            animation-delay: 1.2s;
        }
        .page:nth-of-type(6) {
            animation: bookOpenFlat 3.5s ease forwards; /* Slowed and eased */
            animation-delay: 1.25s;
        }
        @keyframes bookOpen {
            30% { z-index: 999 }
            100% { transform: rotateY(-180deg);
            z-index: 999;}
        }
        @keyframes bookCover {
            30% { z-index: 999 }
            100% { transform: rotateY(-180deg);
            z-index: 1;}
        }
        @keyframes bookOpenFlat {
            30% { z-index: 999 }
            100% { transform: rotateY(-180deg);
            z-index: 999;}
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .book {
                width: 95vw;
                height: calc(95vw * 0.675);
            }
            .page {
                font-size: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="book">
        <span class="page turn"></span>
        <span class="page turn"></span>
        <span class="page turn"></span>
        <span class="page turn"></span>
        <span class="page turn"></span>
        <span class="page turn"></span>
        <span class="cover"></span>
        <span class="page"></span>
        <span class="cover turn"></span>
    </div>
</body>
</html>
