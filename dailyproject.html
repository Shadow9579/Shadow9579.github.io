<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Project - Fortune Teller</title>
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W630DJTY55"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-W630DJTY55');
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Lato", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Curtains */
        .curtains {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            pointer-events: none;
        }

        .curtain {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, #bc8af5 0%, #715393 50%, #382949 100%);
            box-shadow: inset -10px 0 30px rgba(0, 0, 0, 0.5);
            transition: transform 2s ease-in-out;
        }

        .curtain.left {
            left: 0;
            transform-origin: left center;
            border-right: 3px solid rgba(0, 0, 0, 0.3);
        }

        .curtain.right {
            right: 0;
            transform-origin: right center;
            border-left: 3px solid rgba(0, 0, 0, 0.3);
        }

        .curtains.open .curtain.left {
            transform: translateX(-100%);
        }

        .curtains.open .curtain.right {
            transform: translateX(100%);
        }

        .curtain::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(90deg,
                    transparent,
                    transparent 20px,
                    rgba(0, 0, 0, 0.1) 20px,
                    rgba(0, 0, 0, 0.1) 40px);
        }

        /* Stars background */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }
        }

        .container {
            position: absolute;
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 2rem;
            transition: opacity 0.5s ease;
        }

        .container.hidden {
            opacity: 0;
            pointer-events: none;
            z-index: 1;
        }

        /* Ensure crystal ball is always visible when fullscreen, even if parent is hidden */
        .crystal-ball-container.fullscreen {
            opacity: 1 !important;
            visibility: visible !important;
            display: flex !important;
        }

        /* Fortune Teller */
        .fortune-teller {
            position: relative;
            /* Increase width to take up majority of space */
            width: 55vw;
            max-width: 1200px;
            min-width: 300px;
            height: auto;
            display: block;
            margin: 0 auto;
            transition: transform 0.8s ease;
            flex-shrink: 1;
        }

        .fortune-teller.looking-at-ball {
            transform: translateX(20%) rotateY(-15deg);
        }

        /* Base image (body/head) */
        /* Base image (body/head) */
        .base {
            position: relative;
            width: 100%;
            height: auto;
            display: block;
            z-index: 1;
            /* Behind arms */
        }

        /* Arm images */
        /* Arm images */
        .arm {
            position: absolute;
            width: 24.85%;
            /* 212 / 853 */
            height: auto;
            object-fit: contain;
            transform-origin: bottom center;
            /* Rotate from the top */
            z-index: 2;
            /* In front of base */
            top: 50%;
            animation: armWave 4s ease-in-out infinite;
            /* Slow rotate in/out to frame dialogue */
        }

        .arm.left {
            left: 7.9%;
            /* Calculated relative to base width */
            margin-top: -18.5%;
            /* Calculated vert offset relative to width */
        }

        .arm.right {
            left: 65.6%;
            /* Calculated relative to base width */
            margin-top: -21.7%;
            /* Calculated vert offset relative to width */
        }

        /* Keyframe for arm waving animation (slow rotate in and out) */
        @keyframes armWave {
            0% {
                transform: rotate(-5deg);
            }

            /* Slight inward rotation */
            50% {
                transform: rotate(5deg);
            }

            /* Slight outward rotation */
            100% {
                transform: rotate(-5deg);
            }

            /* Back to start */
        }

        /* When looking at the ball, apply additional rotation (like original) */
        .fortune-teller.looking-at-ball .arm.left {
            transform: rotate(-30deg);
        }

        .fortune-teller.looking-at-ball .arm.right {
            transform: rotate(30deg);
        }

        .body {
            width: 200px;
            height: 250px;
            background: linear-gradient(135deg, #4a3c2a 0%, #2d2418 100%);
            border-radius: 100px 100px 20px 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .body::before {
            content: '';
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #6b5d4f 0%, #4a3c2a 100%);
            border-radius: 50%;
        }

        /* Dialogue Box */
        .dialogue-box {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 1.5rem 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            min-width: 300px;
            text-align: center;
            z-index: 100;
            opacity: 1;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .dialogue-box.hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(20px);
            pointer-events: none;
        }

        .dialogue-box p {
            margin-bottom: 1rem;
            color: #333;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .dialogue-input {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .dialogue-input input {
            width: 80px;
            padding: 0.75rem;
            font-size: 1.2rem;
            text-align: center;
            border: 2px solid #007bff;
            border-radius: 10px;
            font-family: "Lato", sans-serif;
            font-weight: 700;
        }

        .dialogue-input input:focus {
            outline: none;
            border-color: #715393;
            box-shadow: 0 0 10px rgba(64, 0, 255, 0.3);
        }

        .dialogue-input button {
            padding: 0.75rem 1.5rem;
            background: #5e457b;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            font-family: "Lato", sans-serif;
        }

        .dialogue-input button:hover {
            background: #382949;
        }

        /* Crystal Ball */
        .crystal-ball-container {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .crystal-ball-container.active {
            opacity: 1 !important;
            visibility: visible !important;
        }

        .crystal-ball-container.fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 500 !important;
            opacity: 1 !important;
            visibility: visible !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        .crystal-ball {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.3), rgba(0, 150, 255, 0.2), rgba(0, 0, 150, 0.4));
            box-shadow:
                0 0 50px rgba(0, 150, 255, 0.5),
                inset -30px -30px 50px rgba(0, 0, 0, 0.3),
                inset 30px 30px 50px rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
            animation: glow 3s ease-in-out infinite;
            transition: width 1s ease, height 1s ease;
        }

        .crystal-ball-container.fullscreen .crystal-ball {
            width: min(70vh, 70vw);
            height: min(70vh, 70vw);
        }

        @keyframes glow {

            0%,
            100% {
                box-shadow:
                    0 0 50px rgba(0, 150, 255, 0.5),
                    inset -30px -30px 50px rgba(0, 0, 0, 0.3),
                    inset 30px 30px 50px rgba(255, 255, 255, 0.2);
            }

            50% {
                box-shadow:
                    0 0 80px rgba(0, 150, 255, 0.8),
                    inset -30px -30px 50px rgba(0, 0, 0, 0.3),
                    inset 30px 30px 50px rgba(255, 255, 255, 0.3);
            }
        }

        .crystal-ball::before {
            content: '';
            position: absolute;
            top: 20%;
            left: 20%;
            width: 60%;
            height: 60%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.4), transparent);
            animation: shimmer 4s ease-in-out infinite;
        }

        @keyframes shimmer {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.4;
            }

            50% {
                transform: translate(10px, 10px) scale(1.1);
                opacity: 0.6;
            }
        }

        .crystal-ball-stand {
            width: 200px;
            height: 30px;
            background: linear-gradient(135deg, #8b7355 0%, #6b5d4f 100%);
            border-radius: 10px;
            margin-top: -10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: width 1s ease;
        }

        .crystal-ball-container.fullscreen .crystal-ball-stand {
            width: min(50vh, 50vw);
        }

        /* Hands for crystal ball */
        .crystal-hands {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .crystal-ball-container.fullscreen .crystal-hands {
            opacity: 1;
        }

        .hand {
            position: absolute;
            width: 120px;
            height: 180px;
            background: linear-gradient(135deg, #8b7355 0%, #6b5d4f 100%);
            border-radius: 60px 60px 20px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            top: 50%;
            transform: translateY(-50%);
        }

        .hand.left {
            left: calc(50% - min(35vh, 35vw) - 140px);
            transform: translateY(-50%) rotate(-20deg);
        }

        .hand.right {
            right: calc(50% - min(35vh, 35vw) - 140px);
            transform: translateY(-50%) rotate(20deg);
        }

        .hand::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 80px;
            background: linear-gradient(135deg, #8b7355 0%, #6b5d4f 100%);
            border-radius: 30px 30px 10px 10px;
        }

        .fingers {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }

        .finger {
            width: 12px;
            height: 40px;
            background: linear-gradient(135deg, #8b7355 0%, #6b5d4f 100%);
            border-radius: 6px;
        }

        .hand.left .fingers {
            transform: translateX(-50%) rotate(10deg);
        }

        .hand.right .fingers {
            transform: translateX(-50%) rotate(-10deg);
        }

        .thought-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            text-align: center;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.8s ease;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            line-height: 1.4;
            z-index: 10;
            pointer-events: none;
        }

        .crystal-ball-container.fullscreen .thought-text {
            font-size: 1.5rem;
            width: 70%;
        }

        .thought-text.visible {
            opacity: 1 !important;
            animation: fadeInText 1s ease;
        }

        @keyframes fadeInText {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }

            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* New Fortune Button */
        .new-fortune-btn {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: "Lato", sans-serif;
            box-shadow: 0 5px 20px rgba(0, 123, 255, 0.4);
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.3s ease;
            z-index: 600;
            pointer-events: none;
        }

        .new-fortune-btn.visible {
            pointer-events: auto;
            opacity: 1 !important;
            animation: slideUp 0.5s ease;
        }

        .new-fortune-btn:hover {
            transform: translateX(-50%) translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 123, 255, 0.6);
        }

        .new-fortune-btn:active {
            transform: translateX(-50%) translateY(-1px);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                padding: 1rem;
            }

            .fortune-teller {
                /* MAJORITY on mobile = almost full width */
                width: 90vw;
                height: auto;
                margin-bottom: 2rem;
            }

            .fortune-teller.looking-at-ball {
                transform: translateY(-100px) translateX(0) rotateY(0);
            }

            .crystal-ball-container {
                width: 300px;
                height: 300px;
            }

            .crystal-ball {
                width: 200px;
                height: 200px;
            }

            .dialogue-box {
                bottom: 20px;
                min-width: 250px;
                padding: 1rem 1.5rem;
            }

            .new-fortune-btn {
                bottom: 20px;
                padding: 0.75rem 1.5rem;
                font-size: 1rem;
            }

            .crystal-ball-container.fullscreen .crystal-ball {
                width: min(60vh, 60vw);
                height: min(60vh, 60vw);
            }

            .hand.left {
                left: calc(50% - min(30vh, 30vw) - 100px);
            }

            .hand.right {
                right: calc(50% - min(30vh, 30vw) - 100px);
            }
        }
    </style>
</head>

<body>
    <div class="stars" id="stars"></div>

    <div class="curtains" id="curtains">
        <div class="curtain left"></div>
        <div class="curtain right"></div>
    </div>

    <div class="container" id="mainContainer">
        <div class="fortune-teller" id="fortuneTeller">
            <!-- PNG body base for teller-->
            <img src="images/Fortune Teller Base.png" alt="Fortune Teller Body" class="base">
            <!-- left arm -->
            <img src="images/Left Arm.png" alt="Fortune Teller Left Arm" class="arm left">
            <!-- right arm -->
            <img src="images/Right Arm.png" alt="Fortune Teller Right Arm" class="arm right">
        </div>
    </div>

    <div class="crystal-ball-container" id="crystalBallContainer">
        <div class="crystal-hands">
            <div class="hand left">
                <div class="fingers">
                    <div class="finger"></div>
                    <div class="finger"></div>
                    <div class="finger"></div>
                    <div class="finger"></div>
                </div>
            </div>
            <div class="hand right">
                <div class="fingers">
                    <div class="finger"></div>
                    <div class="finger"></div>
                    <div class="finger"></div>
                    <div class="finger"></div>
                </div>
            </div>
        </div>
        <div class="crystal-ball" id="crystalBall">
            <div class="thought-text" id="thoughtText"></div>
        </div>
        <div class="crystal-ball-stand"></div>
    </div>

    <div class="dialogue-box" id="dialogueBox">
        <p>What day of the month is it?</p>
        <div class="dialogue-input">
            <input type="number" id="dayInput" min="1" max="31" placeholder="1-31">
            <button id="submitBtn">Tell Me</button>
        </div>
    </div>

    <button class="new-fortune-btn" id="newFortuneBtn">New Fortune</button>

    <script>
        // Shower thoughts for each day of the month
        const showerThoughts = [
            "You've never actually seen your own face, you've only seen reflections and pictures.",
            "Every 'first time' you experience something is also the last time you'll ever be that unprepared.",
            "If you're not supposed to eat at night, why is there a light in the fridge?",
            "Your future self is a stranger that you are slowly becoming.",
            "Humans are the only animals that blush. Or need to.",
            "The sky is the same for everyone, but no two people have ever seen it in the exact same way.",
            "Your handwriting is merely a self-portrait but drawn in letters.",
            "You have already forgotten moments that once meant absolutely everything to you.",
            "Why do we call it 'fast food' when it takes so long to get?",
            "Your signature is a tiny piece of art that you've spent so much time since your childhood perfecting.",
            "Your reflection is not you, it is merely a fleeting arrangement of light that will never exist in the same way again.",
            "If vegetables are so good for you, why do they taste so bad when you are a kid?",
            "A book is just a tree's autobiography.",
            "If you're waiting for the waiter, aren't you the waiter?",
            "You are living in someone's 'good old days' right now.",
            "Insurance is the only type of business that will spend more time and effort to avoid providing its service than actually providing it.",
            "Water is never actually yours, it is just simply your turn to drink it.",
            "Every broken clock you see is just telling you when it passed away.",
            "You can remember that you forgot something yet you can't remember what you forgot.",
            "Every choice you have made or will make erases a thousand possible lives.",
            "You are the only witness to every second of your life.",
            "You've never been in the same body twice, it has merely been replacing itself your whole life.",
            "One day someone will remember you for the last time, and then the world will quietly move on.",
            "Silence is only truly awkward if both people agree that it is.",
            "Do the thing that you've always been scared to do, it will be something that you will thank yourself for doing.",
            "Sweat dries, blood clots, and bruises will fade away, but the memory will remain.",
            "You charge your phone while you sleep so that one of you will actually wake up at 100%.",
            "The difference between a blessing and a curse is the use of agency.",
            "Don't deny your talents and dreams, no matter how ridiculous they may seem.",
            "we are always clapping. It is only that some claps have a longer period of time between them.",
            "The number of possible positions your body can be in is not infinite. There is a limit."
        ];

        // Create stars
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        // Initialize
        createStars();

        // Open curtains on page load
        setTimeout(() => {
            curtains.classList.add('open');
        }, 500);

        const dayInput = document.getElementById('dayInput');
        const submitBtn = document.getElementById('submitBtn');
        const dialogueBox = document.getElementById('dialogueBox');
        const fortuneTeller = document.getElementById('fortuneTeller');
        const crystalBallContainer = document.getElementById('crystalBallContainer');
        const thoughtText = document.getElementById('thoughtText');
        const newFortuneBtn = document.getElementById('newFortuneBtn');
        const curtains = document.getElementById('curtains');
        const mainContainer = document.getElementById('mainContainer');

        // Handle form submission
        function handleSubmit() {
            const day = parseInt(dayInput.value);

            if (day < 1 || day > 31 || isNaN(day)) {
                alert('Please enter a valid day (1-31)');
                return;
            }

            // Hide dialogue box
            dialogueBox.classList.add('hidden');

            // Wait a moment, then animate fortune teller looking at ball
            setTimeout(() => {
                fortuneTeller.classList.add('looking-at-ball');
            }, 500);

            // Show fullscreen crystal ball - do this first
            setTimeout(() => {
                // Add fullscreen class first to position it outside the container
                crystalBallContainer.classList.add('fullscreen');
                // Force a reflow to ensure styles are applied
                void crystalBallContainer.offsetHeight;
                // Add active class to make it visible
                crystalBallContainer.classList.add('active');
                // Ensure it stays visible with inline styles
                crystalBallContainer.style.opacity = '1';
                crystalBallContainer.style.visibility = 'visible';
                crystalBallContainer.style.display = 'flex';
                crystalBallContainer.style.position = 'fixed';
                crystalBallContainer.style.zIndex = '500';
            }, 1500);

            // Hide main container after crystal ball is fully visible and positioned
            setTimeout(() => {
                // Force crystal ball to stay visible with all necessary inline styles
                crystalBallContainer.style.opacity = '1';
                crystalBallContainer.style.visibility = 'visible';
                crystalBallContainer.style.display = 'flex';
                crystalBallContainer.style.position = 'fixed';
                crystalBallContainer.style.zIndex = '500';
                crystalBallContainer.style.top = '0';
                crystalBallContainer.style.left = '0';
                crystalBallContainer.style.width = '100vw';
                crystalBallContainer.style.height = '100vh';
                crystalBallContainer.style.background = 'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)';

                // Now hide the main container
                mainContainer.classList.add('hidden');

                // Final verification after a brief delay to ensure it stays
                setTimeout(() => {
                    if (crystalBallContainer) {
                        crystalBallContainer.style.opacity = '1';
                        crystalBallContainer.style.visibility = 'visible';
                        crystalBallContainer.style.display = 'flex';
                    }
                }, 200);
            }, 2200);

            // Display thought after animation
            setTimeout(() => {
                const thought = showerThoughts[day - 1];
                thoughtText.textContent = thought;
                thoughtText.classList.add('visible');
                // Force visibility
                thoughtText.style.opacity = '1';

                // Show new fortune button after thought appears
                setTimeout(() => {
                    newFortuneBtn.classList.add('visible');
                    newFortuneBtn.style.opacity = '1';
                }, 500);
            }, 2500);
        }

        // Reset everything for a new fortune
        function resetFortune() {
            // Hide new fortune button
            newFortuneBtn.classList.remove('visible');
            newFortuneBtn.style.opacity = '0';

            // Hide thought text
            thoughtText.classList.remove('visible');
            thoughtText.style.opacity = '0';
            thoughtText.textContent = '';


            crystalBallContainer.classList.remove('active', 'fullscreen');
            crystalBallContainer.style.opacity = '';
            crystalBallContainer.style.visibility = '';


            mainContainer.classList.remove('hidden');


            fortuneTeller.classList.remove('looking-at-ball');


            dialogueBox.classList.remove('hidden');


            dayInput.value = '';
            setTimeout(() => {
                dayInput.focus();
            }, 300);
        }

        newFortuneBtn.addEventListener('click', resetFortune);
        submitBtn.addEventListener('click', handleSubmit);

        dayInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSubmit();
            }
        });
        dayInput.focus();
    </script>
</body>

</html>
